<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>너는 주말에 집으로 출근</title><style>
:root{--ink:#55473e;--pink:#f5a7a6;--cream:#fffaf1;--peach:#ffe0c8}*{box-sizing:border-box}body{margin:0;font-family:'Pretendard','Apple SD Gothic Neo',system-ui,sans-serif;color:var(--ink);background:linear-gradient(#fce7d7,#fff5e7);min-height:100vh}button,input{font:inherit}button{cursor:pointer}.app{max-width:1100px;margin:auto;padding:28px 18px 70px}header{text-align:center}h1{font-size:clamp(29px,5vw,52px);margin:8px 0}header p{margin:0 0 20px;color:#937c70}.pill{display:inline-block;background:#fff;border-radius:99px;padding:7px 17px;font-size:13px;color:#b37d78}.scene{height:245px;position:relative;overflow:hidden;border:5px solid white;border-radius:32px;background:linear-gradient(#f8e9d9 0 70%,#d8ad88 70%);box-shadow:0 12px 30px #ab817b22}.window{position:absolute;left:9%;top:25px;width:140px;height:105px;border:10px solid #fff8ee;border-radius:60px 60px 10px 10px;background:linear-gradient(#b7dbed,#e6f7f3);box-shadow:0 3px 0 #d8bba3}.window:after{content:'✦  ☁';position:absolute;top:24px;left:22px;color:#fff;font-size:30px}.sofa{position:absolute;right:10%;bottom:38px;width:210px;height:82px;background:#eab1a4;border:7px solid #fff3e8;border-radius:42px 42px 20px 20px}.sofa:after{content:'';position:absolute;bottom:-20px;left:12px;width:165px;height:18px;background:#c68b78;border-radius:10px}.plant{position:absolute;right:3%;bottom:42px;font-size:72px}.rug{position:absolute;bottom:10px;left:30%;width:40%;height:26px;border-radius:50%;background:#f9e4c5}.buddy{position:absolute;bottom:32px;width:64px;height:66px;border-radius:47% 47% 42% 42%;border:3px solid #68594e;background:#fffdf8;animation:walk 7s ease-in-out infinite alternate,bob .5s ease-in-out infinite alternate;z-index:2}.buddy:before,.buddy:after{content:'';position:absolute;top:-12px;width:23px;height:23px;background:inherit;border:3px solid #68594e;border-radius:50%;z-index:-1}.buddy:before{left:3px}.buddy:after{right:3px}.buddy .face{position:absolute;top:29px;left:12px;font-size:18px;white-space:nowrap}.buddy .blush{position:absolute;top:43px;left:8px;font-size:9px;color:#ed9ca5}.buddy:nth-of-type(2){left:7%;animation-delay:-1s}.buddy:nth-of-type(3){left:26%;background:#ffe4c3;animation-delay:-3s;animation-duration:9s,.6s}.buddy:nth-of-type(4){left:47%;background:#f5dbe6;animation-delay:-5s;animation-duration:8s,.55s}.buddy:nth-of-type(5){left:66%;background:#e7e9ff;animation-delay:-2s;animation-duration:10s,.45s}@keyframes walk{from{transform:translateX(-20px)}to{transform:translateX(65px)}}@keyframes bob{to{margin-bottom:8px}}.layout{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:23px}.panel{background:#fffdf8;border:3px solid #fff;border-radius:28px;padding:22px;box-shadow:0 10px 24px #b88c7620}.panel h2{font-size:21px;margin:0 0 12px}.sub{color:#a18b80;font-size:13px;margin:0 0 15px}.tasks{display:grid;grid-template-columns:1fr 1fr;gap:8px}.task{display:flex;align-items:center;gap:6px;background:#fff2e8;border-radius:13px;padding:8px 9px;border:1px solid #f5dfd2}.task input{width:100%;min-width:0;background:transparent;border:0;outline:0;color:#655045;font-size:13px}.task:focus-within{outline:2px solid #efa9a4}.task span{font-size:12px;color:#c39987}.controls{display:flex;gap:9px;margin-top:14px;flex-wrap:wrap}.small{border:0;background:#f7e8dd;border-radius:12px;padding:10px 13px;color:#745d50;font-weight:700}.primary{width:100%;border:0;border-radius:18px;padding:17px;background:linear-gradient(120deg,#f4a0a4,#f6bd8f);color:#fff;font-size:20px;font-weight:900;box-shadow:0 7px 0 #d88f86;transition:transform .1s,box-shadow .1s}.primary:active{transform:translateY(5px);box-shadow:0 2px 0 #d88f86}.primary:disabled{opacity:.75;cursor:wait}.slot{background:#fff3e9;border:2px dashed #eac5b4;border-radius:20px;padding:14px;margin:12px 0;display:flex;align-items:center;gap:15px;min-height:111px;transition:background .2s}.slot strong{display:block;font-size:23px;margin-top:5px;word-break:keep-all}.slot .label{font-size:12px;font-weight:800;color:#b68b7a}.slot.spinning{background:#ffe4d7}.bear{position:relative;flex:0 0 75px;height:74px}.bear .head{position:absolute;top:13px;left:7px;width:61px;height:55px;background:#dca87d;border:3px solid #795d4d;border-radius:45%;z-index:1}.bear .ear{position:absolute;top:5px;width:24px;height:25px;border:3px solid #795d4d;background:#dca87d;border-radius:50%}.bear .ear.left{left:8px}.bear .ear.right{right:7px}.bear .eyes{position:absolute;top:35px;left:20px;z-index:2;font-size:16px}.bear .sweat{position:absolute;top:7px;right:-1px;font-size:23px;z-index:3;animation:sweat .8s infinite alternate}.bear .arm{position:absolute;bottom:0;left:1px;font-size:27px;z-index:3;animation:work .35s infinite alternate}.bear .arm.right{left:auto;right:0;animation-delay:.2s}@keyframes work{to{transform:rotate(30deg) translateY(-6px)}}@keyframes sweat{to{transform:translateY(7px);opacity:.5}}.resultNote{font-size:13px;color:#ad8c7b;text-align:center;min-height:20px}.confetti{position:fixed;pointer-events:none;z-index:10;width:9px;height:14px;border-radius:3px;animation:fall 1.3s ease-in forwards}@keyframes fall{to{transform:translate(var(--dx),95vh) rotate(720deg);opacity:0}}.footer{text-align:center;margin-top:23px;color:#b28e7e;font-size:13px}@media(max-width:750px){.layout{grid-template-columns:1fr}.scene{height:205px}.sofa{right:5%;width:145px}.plant{font-size:48px}.buddy{scale:.8}.panel{padding:17px}.task input{font-size:12px}}@media(max-width:380px){.tasks{grid-template-columns:1fr}.scene{height:175px}}
</style></head><body><main class="app"><header><span class="pill">🏡 주말에도 퇴근은 없다!</span><h1>너는 주말에 집으로 출근</h1><p>맞벌이 부부의 귀염뽀짝 집안일 랜덤 배정기 ✨</p></header><section class="scene" aria-label="포근한 집에서 돌아다니는 귀여운 동물 친구들"><div class="window"></div><div class="rug"></div><div class="sofa"></div><div class="plant">🪴</div><div class="buddy"><span class="face">•ᴥ•</span><span class="blush">●　　 ●</span></div><div class="buddy"><span class="face">•ᴗ•</span><span class="blush">●　　 ●</span></div><div class="buddy"><span class="face">•ﻌ•</span><span class="blush">●　　 ●</span></div><div class="buddy"><span class="face">•ω•</span><span class="blush">●　　 ●</span></div></section><div class="layout"><section class="panel"><h2>🧺 집안일 후보 명단</h2><p class="sub">최대 12개 · 자유롭게 수정할 수 있어요. 빈칸은 추첨에서 제외돼요.</p><div id="tasks" class="tasks"></div><div class="controls"><button class="small" id="reset">↺ 기본 목록 복원</button><button class="small" id="clear">✕ 모두 비우기</button></div></section><section class="panel"><h2>🎀 오늘의 집안일</h2><p class="sub">오전 하나, 오후 하나! 중복 없이 운명에 맡겨봐요.</p><div class="slot" id="morning"><div class="bear"><div class="ear left"></div><div class="ear right"></div><div class="head"></div><span class="eyes">• ᴥ •</span><span class="sweat">💦</span><span class="arm">🧽</span><span class="arm right">✨</span></div><div><span class="label">☀️ 오전의 미션</span><strong class="chosen">두근두근…</strong></div></div><div class="slot" id="afternoon"><div class="bear"><div class="ear left"></div><div class="ear right"></div><div class="head"></div><span class="eyes">• ᴥ •</span><span class="sweat">💦</span><span class="arm">🧹</span><span class="arm right">✨</span></div><div><span class="label">🌙 오후의 미션</span><strong class="chosen">무엇이 나올까?</strong></div></div><button id="spin" class="primary">🎰 오늘의 집안일!</button><p id="note" class="resultNote" aria-live="polite">버튼을 눌러 곰돌이와 함께 출근해요 🐻</p></section></div><p class="footer">☕ 집안일 끝나면 우리 둘 다 달콤한 휴식!</p></main><script>
const defaults=['식사 준비','설거지','건조기 먼지 털기','세탁기 돌리기','빨래 개기','바닥 청소기 돌리기','물걸레질','분리수거','음식물 쓰레기 버리기','화장실 청소','주방 정리','침구 정리'];const holder=document.getElementById('tasks'),spin=document.getElementById('spin'),note=document.getElementById('note');let busy=false;function drawTasks(arr){holder.innerHTML='';for(let i=0;i<12;i++){const label=document.createElement('label');label.className='task';const num=document.createElement('span');num.textContent=String(i+1).padStart(2,'0');const input=document.createElement('input');input.maxLength=30;input.placeholder='집안일 입력';input.setAttribute('aria-label',`${i+1}번째 집안일`);input.value=arr[i]||'';input.addEventListener('input',save);label.append(num,input);holder.append(label)}}function values(){return [...holder.querySelectorAll('input')].map(e=>e.value.trim())}function save(){try{localStorage.setItem('houseworkTasks',JSON.stringify(values()))}catch(e){}}let stored;try{stored=JSON.parse(localStorage.getItem('houseworkTasks'))}catch(e){}drawTasks(Array.isArray(stored)&&stored.length===12?stored:defaults);document.getElementById('reset').onclick=()=>{if(busy)return;drawTasks(defaults);save()};document.getElementById('clear').onclick=()=>{if(busy)return;drawTasks(Array(12).fill(''));save()};const slots=[document.getElementById('morning'),document.getElementById('afternoon')];function randomIndex(n){if(globalThis.crypto?.getRandomValues){const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%n}return Math.floor(Math.random()*n)}function confetti(){for(let i=0;i<38;i++){const p=document.createElement('i');p.className='confetti';p.style.left=Math.random()*100+'vw';p.style.top='-20px';p.style.background=['#f3a6aa','#f9ca8b','#b3d8b0','#c7b9f0'][i%4];p.style.setProperty('--dx',(Math.random()*220-110)+'px');p.style.animationDelay=Math.random()*.45+'s';document.body.append(p);setTimeout(()=>p.remove(),1900)}}spin.onclick=()=>{if(busy)return;const candidates=[...new Set(values().filter(Boolean))];if(candidates.length<2){note.textContent='🥺 서로 다른 집안일을 최소 2개 입력해 주세요!';return}busy=true;spin.disabled=true;spin.textContent='🌀 운명의 룰렛 회전 중…';note.textContent='곰돌이들이 열심히 후보를 고르는 중!';slots.forEach(s=>s.classList.add('spinning'));let count=0;const timer=setInterval(()=>{slots.forEach(s=>s.querySelector('.chosen').textContent=candidates[randomIndex(candidates.length)]);count++;if(count>=23){clearInterval(timer);const first=randomIndex(candidates.length);const rest=candidates.filter((_,i)=>i!==first);const picked=[candidates[first],rest[randomIndex(rest.length)]];slots.forEach((s,i)=>{s.querySelector('.chosen').textContent=picked[i];s.classList.remove('spinning')});spin.disabled=false;spin.textContent='🎰 다시 뽑기!';note.textContent='🎉 오늘도 수고할 우리! 끝나면 간식 타임 🍪';confetti();busy=false}},85)};
</script></body></html>
